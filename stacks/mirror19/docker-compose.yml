# Local read-only mirror of the VPS Odoo 19 (restored from backups/2026-11-20_0215).
# Separate project, ports and volumes from the main layak-odoo stack.
name: layak-mirror19
services:
  web:
    image: odoo:19.0-20261112
    depends_on: [db]
    ports:
      - "127.0.0.1:8070:8069"
    volumes:
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - web-data:/var/lib/odoo
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  web-data:
  db-data:
